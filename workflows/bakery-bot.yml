```yaml
name: Bakery Bot

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run bot
        run: node bakery-bot.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
```
