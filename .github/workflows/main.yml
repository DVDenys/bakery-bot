name: Bakery Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node bakery-bot.js
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
